# scenario: crashloop-exit127
# expect: KT001/exit-127
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-exit127
  namespace: kt-demo
  labels: {kt-scenario: crashloop-exit127}
spec:
  replicas: 1
  selector:
    matchLabels: {kt-scenario: crashloop-exit127}
  template:
    metadata:
      labels: {kt-scenario: crashloop-exit127}
    spec:
      tolerations:
        - {key: kt-demo, operator: Exists}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "migrate-db --up"]
          resources:
            limits: {memory: 64Mi}
            requests: {memory: 32Mi, cpu: 10m}
