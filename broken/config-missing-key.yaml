# scenario: config-missing-key
# expect: KT005/missing-configmap-key
apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: kt-demo}
data: {LOG_LEVEL: info}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-missing-key
  namespace: kt-demo
  labels: {kt-scenario: config-missing-key}
spec:
  replicas: 1
  selector:
    matchLabels: {kt-scenario: config-missing-key}
  template:
    metadata:
      labels: {kt-scenario: config-missing-key}
    spec:
      tolerations:
        - {key: kt-demo, operator: Exists}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: {name: app-config, key: DB_HOST}
          resources:
            limits: {memory: 64Mi}
            requests: {memory: 32Mi, cpu: 10m}
