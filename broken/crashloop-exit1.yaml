# scenario: crashloop-exit1
# expect: KT001/exit-1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-exit1
  namespace: kt-demo
  labels: {kt-scenario: crashloop-exit1}
spec:
  replicas: 1
  selector:
    matchLabels: {kt-scenario: crashloop-exit1}
  template:
    metadata:
      labels: {kt-scenario: crashloop-exit1}
    spec:
      tolerations:
        - {key: kt-demo, operator: Exists}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo \"fatal: cannot reach database\" >&2; exit 1"]
          resources:
            limits: {memory: 64Mi}
            requests: {memory: 32Mi, cpu: 10m}
