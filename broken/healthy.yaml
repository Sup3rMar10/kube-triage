# scenario: healthy
# expect: none
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy
  namespace: kt-demo
  labels: {kt-scenario: healthy}
spec:
  replicas: 1
  selector:
    matchLabels: {kt-scenario: healthy}
  template:
    metadata:
      labels: {kt-scenario: healthy}
    spec:
      tolerations:
        - {key: kt-demo, operator: Exists}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            limits: {memory: 64Mi}
            requests: {memory: 32Mi, cpu: 10m}
