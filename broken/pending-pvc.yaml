# scenario: pending-pvc
# expect: KT004/unbound-pvc
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-pvc
  namespace: kt-demo
  labels: {kt-scenario: pending-pvc}
spec:
  replicas: 1
  selector:
    matchLabels: {kt-scenario: pending-pvc}
  template:
    metadata:
      labels: {kt-scenario: pending-pvc}
    spec:
      tolerations:
        - {key: kt-demo, operator: Exists}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: missing-claim}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            limits: {memory: 64Mi}
            requests: {memory: 32Mi, cpu: 10m}
