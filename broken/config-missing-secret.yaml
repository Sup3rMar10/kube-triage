# scenario: config-missing-secret
# expect: KT005/missing-secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-missing-secret
  namespace: kt-demo
  labels: {kt-scenario: config-missing-secret}
spec:
  replicas: 1
  selector:
    matchLabels: {kt-scenario: config-missing-secret}
  template:
    metadata:
      labels: {kt-scenario: config-missing-secret}
    spec:
      tolerations:
        - {key: kt-demo, operator: Exists}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-credentials, key: password}
          resources:
            limits: {memory: 64Mi}
            requests: {memory: 32Mi, cpu: 10m}
