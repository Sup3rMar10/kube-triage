# scenario: imagepull-host
# expect: KT002/registry-unreachable
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull-host
  namespace: kt-demo
  labels: {kt-scenario: imagepull-host}
spec:
  replicas: 1
  selector:
    matchLabels: {kt-scenario: imagepull-host}
  template:
    metadata:
      labels: {kt-scenario: imagepull-host}
    spec:
      tolerations:
        - {key: kt-demo, operator: Exists}
      containers:
        - name: app
          image: registry.invalid/shop/app:1.0
          command: ["sh", "-c", "sleep 3600"]
          resources:
            limits: {memory: 64Mi}
            requests: {memory: 32Mi, cpu: 10m}
