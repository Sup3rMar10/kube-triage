# scenario: oom-killed
# expect: KT003/limit-set
# The shell holds ~200 MB in a variable, which is more than the 96Mi limit, so the kernel OOM-kills the container.
# (Limits below roughly 48Mi on a kind node on WSL2 do not even let the container start: see
# fixtures/dev/kind-oom-limit-too-low.json.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-killed
  namespace: kt-demo
  labels: {kt-scenario: oom-killed}
spec:
  replicas: 1
  selector:
    matchLabels: {kt-scenario: oom-killed}
  template:
    metadata:
      labels: {kt-scenario: oom-killed}
    spec:
      tolerations:
        - {key: kt-demo, operator: Exists}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "x=$(head -c 200000000 /dev/zero | tr '\\0' x); echo allocated; sleep 3600"]
          resources:
            limits: {memory: 96Mi}
            requests: {memory: 64Mi}
