# scenario: pending-cpu
# expect: KT004/cpu-exceeds-node-capacity
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-cpu
  namespace: kt-demo
  labels: {kt-scenario: pending-cpu}
spec:
  replicas: 1
  selector:
    matchLabels: {kt-scenario: pending-cpu}
  template:
    metadata:
      labels: {kt-scenario: pending-cpu}
    spec:
      tolerations:
        - {key: kt-demo, operator: Exists}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            limits: {memory: 64Mi}
            requests: {cpu: "512", memory: 32Mi}
